<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FWI Prediction</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                linear-gradient(135deg, rgba(8, 25, 45, 0.92), rgba(12, 80, 55, 0.85)),
                linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .login {
            width: 100%;
            max-width: 520px;
            padding: 38px;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 22px;
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35),
                0 0 0 1px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff9800, #f44336);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 10px 25px rgba(244, 67, 54, 0.3);
        }

        .login h1 {
            color: #17202a;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #718096;
            font-size: 14px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .input-group {
            position: relative;
        }

        .input-group.full {
            grid-column: span 2;
        }

        .input-group label {
            display: block;
            color: #374151;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .login form input {
            width: 100%;
            padding: 13px 15px;
            border: 1.5px solid #d8dee8;
            border-radius: 10px;
            background: #f8fafc;
            color: #1f2937;
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
        }

        .login form input::placeholder {
            color: #a0aec0;
        }

        .login form input:hover {
            border-color: #aab7c8;
            background: #fff;
        }

        .login form input:focus {
            border-color: #16a085;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(22, 160, 133, 0.12);
        }

        .login form button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #16a085, #0e8f6e);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(14, 143, 110, 0.25);
        }

        .login form button:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #19b394, #0b7f62);
            box-shadow: 0 12px 25px rgba(14, 143, 110, 0.35);
        }

        .login form button:active {
            transform: translateY(0);
        }

        .login form button:focus {
            outline: none;
            box-shadow:
                0 0 0 4px rgba(22, 160, 133, 0.2),
                0 8px 20px rgba(14, 143, 110, 0.25);
        }

        .login form button:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            border-radius: 12px;
            background: linear-gradient(
                135deg,
                rgba(22, 160, 133, 0.1),
                rgba(46, 204, 113, 0.08)
            );
            border: 1px solid rgba(22, 160, 133, 0.2);
            text-align: center;
        }

        .result-title {
            color: #64748b;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .result-value {
            color: #087f5b;
            font-size: 26px;
            font-weight: 800;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #94a3b8;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .login {
                padding: 28px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .input-group.full {
                grid-column: span 1;
            }

            .login h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="login">

        <div class="header">
            <div class="icon">🔥</div>
            <h1>FWI Prediction</h1>
            <p class="subtitle">
                Forest Fire Weather Index Prediction System
            </p>
        </div>

        <!-- Main Input For Receiving Query to our ML -->
        <form action="{{ url_for('predict_datapoint')}}" method="post">

            <div class="form-grid">

                <div class="input-group">
                    <label>Temperature</label>
                    <input type="text"
                           name="Temperature"
                           placeholder="Temperature"
                           required="required">
                </div>

                <div class="input-group">
                    <label>Relative Humidity</label>
                    <input type="text"
                           name="RH"
                           placeholder="RH"
                           required="required">
                </div>

                <div class="input-group">
                    <label>Wind Speed</label>
                    <input type="text"
                           name="Ws"
                           placeholder="Ws"
                           required="required">
                </div>

                <div class="input-group">
                    <label>Rain</label>
                    <input type="text"
                           name="Rain"
                           placeholder="Rain"
                           required="required">
                </div>

                <div class="input-group">
                    <label>FFMC</label>
                    <input type="text"
                           name="FFMC"
                           placeholder="FFMC"
                           required="required">
                </div>

                <div class="input-group">
                    <label>DMC</label>
                    <input type="text"
                           name="DMC"
                           placeholder="DMC"
                           required="required">
                </div>

                <div class="input-group">
                    <label>ISI</label>
                    <input type="text"
                           name="ISI"
                           placeholder="ISI"
                           required="required">
                </div>

                <div class="input-group">
                    <label>Classes</label>
                    <input type="text"
                           name="Classes"
                           placeholder="Classes"
                           required="required">
                </div>

                <div class="input-group full">
                    <label>Region</label>
                    <input type="text"
                           name="Region"
                           placeholder="Region"
                           required="required">
                </div>

            </div>

            <button type="submit">
                🔥 Predict FWI
            </button>

        </form>

        <div class="result">
            <div class="result-title">FWI Prediction Result</div>
            <div class="result-value">{{ result }}</div>
        </div>

        <div class="footer">
            Forest Fire Weather Index • Machine Learning Prediction
        </div>

    </div>

</body>
</html>
